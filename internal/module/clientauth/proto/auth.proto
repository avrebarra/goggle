syntax = "proto3";

package auth;

option go_package = "github.com/avrebarra/goggle/internal/module/clientauth/proto/generated";

// Auth service for session token validation
service AuthService {
  // Validate session token and return user info
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
}

// ======= Request/Response Messages =======

message ValidateSessionRequest {
  string token = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  UserInfo user = 2;
}

// ======= Entity Messages =======

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
}
